services:
  backend:
    build: ./backend
    ports:
      - "5000:5000"
    environment:
      DATABASE_URL: postgresql://notes:password@database:5432/notes
    depends_on:
      - database

  frontend:
    build: ./frontend
    ports:
      - "3000:3000"

  database:
    image: postgres:16
    environment:
      POSTGRES_DB: notes
      POSTGRES_USER: notes
      POSTGRES_PASSWORD: password